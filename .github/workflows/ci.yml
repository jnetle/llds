name: CI

# The gate every PR — Dependabot's included — has to pass before it can merge. Branch protection on `main` requires
# the `verify` check by name, so renaming the job silently un-gates the branch: update the protection rule with it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` fails if package.json and the lockfile disagree — the first thing a bad dependency bump breaks.
      - run: npm ci

      - name: Lint (ESLint, CSS guard, content guard)
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The build proves pages compile and prerender; this proves the built server serves them.
      - name: Smoke test
        run: |
          npm start -- -p 3000 > next-start.log 2>&1 &
          npm run smoke -- http://localhost:3000

      - name: Server log
        if: failure()
        run: cat next-start.log || true
