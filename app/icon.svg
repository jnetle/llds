<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <style>
    .scheme-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .scheme-light { display: none; }
      .scheme-dark { display: inline; }
    }
  </style>
  <image class="scheme-light" width="256" height="256" href="data:image/png;base64," />
  <image class="scheme-dark" width="256" height="256" href="data:image/png;base64," />
</svg>
